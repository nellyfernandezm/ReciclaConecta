<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recojos disponibles · ReciclaConecta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="cabecera">
  <a class="marca" href="/index.html"><span class="logo">♻</span>ReciclaConecta</a>
  <nav id="nav"></nav>
</header>
<main>
<h1>Recojos disponibles</h1>
<p class="sub" id="aviso">Solicitudes pendientes cerca de ti. Acepta una y pasa a recogerla.</p>
<div class="filtros">
  <div class="campo"><label for="material">Material</label><select id="material"></select></div>
  <div class="campo"><label for="radio">Radio</label>
    <select id="radio"><option value="3">3 km</option><option value="5">5 km</option><option value="10" selected>10 km</option><option value="25">25 km</option></select></div>
  <button class="btn sec" id="cerca" type="button">📍 Usar mi ubicación</button>
</div>
<div id="msg"></div>
<div class="mapa-layout">
  <div id="mapa" class="mapa"></div>
  <div class="panel"><h2>Disponibles</h2><div id="disponibles" class="lista"></div></div>
</div>
<section class="panel separado">
  <h2>Mis recojos aceptados</h2>
  <div id="mios" class="grid-3"></div>
</section>
</main>
<footer>ReciclaConecta · Conectamos a quienes reciclan con puntos de acopio y recolectores</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/js/comun.js"></script>
<script src="/js/recolector.js"></script>
</body>
</html>
