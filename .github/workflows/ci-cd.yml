# Pipeline CI/CD DevSecOps de ReciclaConecta
# build + pruebas -> seguridad (secretos, dependencias, SAST, imagen) -> despliegue en Render (solo main)
name: CI-CD ReciclaConecta

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos por defecto (principio de menor privilegio).
permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # 1) Compilar y ejecutar pruebas unitarias + integración
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restaurar paquetes
        run: dotnet restore ReciclaConecta.sln
      - name: Compilar (Release)
        run: dotnet build ReciclaConecta.sln -c Release --no-restore
      - name: Pruebas unitarias e integración
        run: >
          dotnet test ReciclaConecta.sln -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage"
          --results-directory TestResults
      - name: Resumen de pruebas
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          out = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
          for trx in glob.glob('TestResults/**/*.trx', recursive=True):
              c = ET.parse(trx).getroot().find('t:ResultSummary/t:Counters', ns).attrib
              out.write('## Resultado de las pruebas\n\n| Total | Correctas | Fallidas |\n|---|---|---|\n')
              out.write(f"| {c['total']} | {c['passed']} | {c['failed']} |\n\n")
          for cob in glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True):
              r = ET.parse(cob).getroot().attrib
              out.write(f"**Cobertura de líneas:** {float(r['line-rate'])*100:.1f} %  ·  **ramas:** {float(r['branch-rate'])*100:.1f} %\n")
          PY
      - name: Publicar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults

  # 2) Escaneo de secretos en todo el historial (Gitleaks)
  secretos:
    name: Escaneo de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks v8.21.2
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Buscar secretos
        run: gitleaks detect --source . --redact -v --exit-code 1

  # 3) Análisis de dependencias vulnerables (SCA)
  dependencias:
    name: Dependencias vulnerables (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore ReciclaConecta.sln
      - name: Revisar paquetes NuGet (directos y transitivos)
        run: |
          dotnet list ReciclaConecta.sln package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -qE "High|Critical" vulnerables.txt; then
            echo "::error::Hay dependencias con vulnerabilidades altas o críticas"
            exit 1
          fi
          echo "Sin vulnerabilidades altas o críticas" >> $GITHUB_STEP_SUMMARY

  # 4) Análisis estático de código (SAST) con CodeQL
  sast:
    name: SAST (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compilar para CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build ReciclaConecta.sln -c Release
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # 5) Construir la imagen Docker y escanearla (Trivy)
  imagen:
    name: Imagen Docker + Trivy
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t reciclaconecta:${{ github.sha }} .
      - name: Escanear imagen (vulnerabilidades HIGH/CRITICAL con parche)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: reciclaconecta:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name app -e PORT=8080 -p 8080:8080 reciclaconecta:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/api/puntos > /dev/null
          echo "Contenedor responde /health y /api/puntos" >> $GITHUB_STEP_SUMMARY

  # 6) Despliegue continuo en Render (solo cuando todo pasa en main)
  deploy:
    name: Despliegue en Render
    runs-on: ubuntu-latest
    needs: [build-test, secretos, dependencias, sast, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: produccion
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar deploy hook de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::No existe el secreto RENDER_DEPLOY_HOOK; se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Despliegue solicitado a Render" >> $GITHUB_STEP_SUMMARY
      - name: Verificar la aplicación publicada
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::Variable APP_URL no definida"; exit 0; fi
          sleep 60
          for i in $(seq 1 20); do
            if curl -fs "$APP_URL/health"; then echo "OK: $APP_URL" >> $GITHUB_STEP_SUMMARY; exit 0; fi
            sleep 15
          done
          echo "::error::La aplicación no respondió en $APP_URL/health"; exit 1
